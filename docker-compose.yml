# strengthmaxxing — Coolify / Docker Compose deployment (Coolify: Base Directory "/",
# Docker Compose Location "/docker-compose.yml"). Build contexts are relative to the repo root.
#
# Two services on one network:
#   web   -> SvelteKit dashboard + JSON API (port 3000), owns the sqlite DB
#   agent -> Claude coach service (port 8787), reached by web at http://agent:8787

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    # Published on the server so a Cloudflare tunnel can reach it at localhost:3417
    # (3417, not 3000, to stay clear of other apps on the same server). No Coolify domain needed.
    ports:
      - "${WEB_HOST_PORT:-3417}:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      # sqlite lives on the named volume mounted at /data (see volumes below).
      DB_PATH: "${DB_PATH:-/data/strengthmaxxing.db}"
      # Bearer token gating /api/* (watch, phone, agent) — set this in Coolify secrets.
      API_TOKEN: "${API_TOKEN}"
      # Dashboard sign-in password. Falls back to API_TOKEN if unset.
      DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD:-}"
      # Watch motion recordings can be ~1-2 MB; SvelteKit's default body cap is 512 KB.
      BODY_SIZE_LIMIT: "${BODY_SIZE_LIMIT:-4M}"
      # Behind Coolify's proxy SvelteKit must know its public URL, or browser form posts
      # (dashboard login, logging sets) are rejected as cross-site.
      ORIGIN: "${ORIGIN:-https://strengthmaxxing.simmerman.tech}"
      PROTOCOL_HEADER: "${PROTOCOL_HEADER:-x-forwarded-proto}"
      HOST_HEADER: "${HOST_HEADER:-x-forwarded-host}"
      ADDRESS_HEADER: "${ADDRESS_HEADER:-x-forwarded-for}"
      # Dates on the dashboard render in this zone.
      TZ: "${TZ:-America/New_York}"
      # Internal service DNS name; do NOT expose the agent publicly.
      AGENT_URL: "${AGENT_URL:-http://agent:8787}"
    volumes:
      - smx-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - agent
    networks:
      - smx

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    restart: unless-stopped
    # No published ports: agent is internal-only, reachable at http://agent:8787
    # from the web service over the shared network. `expose` documents the port.
    expose:
      - "8787"
    environment:
      PORT: "8787"
      # Auth for the coach: either mount ~/.claude creds (volume below) so the
      # `claude` CLI uses the personal subscription, OR set ANTHROPIC_API_KEY.
      # Personal Claude subscription: run `claude setup-token` on any machine you're logged
      # in on and paste the token here (valid 1 year). Leave ANTHROPIC_API_KEY empty then.
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      AGENT_MODEL: "${AGENT_MODEL:-}"
      AGENT_EFFORT: "${AGENT_EFFORT:-medium}"
    networks:
      - smx

volumes:
  # Persists the sqlite database across redeploys/restarts. DB_PATH -> /data/...
  smx-data:

networks:
  smx:
    driver: bridge
